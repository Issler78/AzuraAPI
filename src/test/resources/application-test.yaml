spring:
  application:
    api-key: test-api-key
    gateway-key: test-gateway-key
    gateway-url: undefined # it should be replaced with the actual URL of the gateway service when running tests.
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: test
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
jwt:
  key: test-jwt-key
  expiration: 900000
logging:
  level:
    org.springframework.test.context.cache: DEBUG